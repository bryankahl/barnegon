<!DOCTYPE html>

<head>

  <!-- Tailwind CSS CDN -->

  <style>
    body { font-family: 'Inter', sans-serif; }
    html, body {
      height: 100%;
      overflow: hidden;
    }

    /* Fancy scrollbar for main Barnegon pages */
  ::-webkit-scrollbar {
    width: 12px;
  }

  ::-webkit-scrollbar-track {
    background: #f3f4f6; /* Light gray track */
    border-radius: 8px;
  }

  ::-webkit-scrollbar-thumb {
    background: linear-gradient(to bottom, #6366f1, #8b5cf6); /* Indigo to purple */
    border-radius: 10px;
    border: 2px solid white;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(to bottom, #4f46e5, #7c3aed);
  }

  ::-webkit-scrollbar-thumb:active {
    background: linear-gradient(to bottom, #4338ca, #6d28d9); /* Prevent turning white */
  }

  body {
    scrollbar-color: #6366f1 #f3f4f6; /* Firefox fallback */
    scrollbar-width: thin;
  }
  </style>
